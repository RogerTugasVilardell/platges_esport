    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #fcfcfc;
      font-family: 'Merriweather', serif;
      font-size: 14px;
      line-height: 1.5;
      color: #232323;
    }
    .infografia-container {
      width: 100%;
      height: 100%;
      padding: 16px 12px 12px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1.titol {
      font-family: 'PPPangaia', sans-serif;
      font-weight: 500;
      font-size: 28px;
      color: #232323;
      margin: 0 0 12px 0;
      line-height: 1.3;
      text-align: center;
      max-width: 960px;
    }
    .mapa-wrapper {
      position: relative;
      width: 100%;
      max-width: 960px;
      flex: 1;
      min-height: 0;
    }
    svg#mapa {
      display: block;
      overflow: visible;
    }
    .peu-pagina {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      padding: 0;
      width: 100%;
      max-width: 960px;
      box-sizing: border-box;
    }
    .font-text {
      font-size: 12.5px;
      color: #4f4f4f;
      font-family: 'Merriweather', serif;
      flex: 1;
      padding-right: 14px;
      line-height: 1.35;
      text-align: left;
    }
    .logo-peu {
      height: 21px;
      width: auto;
      flex-shrink: 0;
    }
    #tooltip {
      position: fixed;
      background: rgba(255,255,255,0.97);
      border: 1px solid #CCCCCC;
      border-radius: 4px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      padding: 8px 10px;
      font-size: 13px;
      font-family: 'Merriweather', serif;
      color: #232323;
      line-height: 1.35;
      pointer-events: none;
      display: none;
      max-width: 240px;
      z-index: 100;
    }
    #zoom-controls {
      position: absolute;
      display: none;
      flex-direction: column;
      gap: 4px;
      z-index: 10;
    }
    .ctrl-btn {
      background: rgba(255,255,255,0.92);
      border: 1px solid #CCCCCC;
      border-radius: 4px;
      width: 26px;
      height: 26px;
      padding: 0;
      font-size: 14px;
      font-family: 'Roboto', sans-serif;
      color: #232323;
      cursor: pointer;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ctrl-btn:hover { background: #f0f0f0; }
    /* Disseny mòbil (blocs 1 i 2): títol curt i sense crèdit del mapa */
    @media (max-width: 899px) {
      h1.titol { font-size: 20px; }
      .titol-extra, .font-mapa { display: none; }
    }
    @media (max-width: 767px) {
      .peu-pagina {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }
      .font-text { padding-right: 0; }
      .logo-peu  { height: 18px; align-self: flex-end; }
    }
  </style>
</head>

    // ───────────── CONSTANTS I UTILITATS ─────────────
    const C = { salmo: '#FF802E', text: '#232323', text2: '#4f4f4f', linia: '#4f4f4f', base: '#CFCFC7',
                mar: '#D2E7F8', terra: '#E4E4DC', parc: '#C5E8DE', sorra: '#FFFD8F' };
    const FR = "'Roboto', sans-serif", FM = "'Merriweather', serif";
    const NOTA_B1 = 'Un mateix turista pot fer diverses activitats.';

    // Cap text del gràfic és més petit que el peu de font (12,5px)

    let defs;

    const cnv = document.createElement('canvas').getContext('2d');
    function mesura(t, size, weight, fam) {
      cnv.font = `${weight || 400} ${size}px ${fam === FM ? 'Merriweather, serif' : 'Roboto, sans-serif'}`;

    // Trossos de text on es pot partir la línia: espais i després de «/» o «-»
    function trossos(text) {
      const toks = [];
      text.split(' ').forEach((w, i) => w.split(/(?<=[\/-])/).forEach((p, j) => toks.push({ t: p, sp: j === 0 && i > 0 })));
      return toks;
    }
    const netejaShy = t => t.split(SHY).join('');
    function trenca(text, maxW, size, weight, fam) {
      const M = t => mesura(t, size, weight, fam);
      const lines = []; let cur = '';
      trossos(text).forEach(tk => {
        const clean = netejaShy(tk.t);
        const joined = cur ? cur + (tk.sp ? ' ' : '') + clean : clean;
        if (!cur && M(clean) <= maxW || cur && M(joined) <= maxW) { cur = joined; return; }
        if (cur) lines.push(cur);
        // La paraula no cap sencera: partir-la al final d'una síl·laba
        let parts = tk.t.split(SHY);
        while (parts.length > 1 && M(parts.join('')) > maxW) {
          let k = parts.length - 1;
          while (k > 1 && M(parts.slice(0, k).join('') + '-') > maxW) k--;
          lines.push(parts.slice(0, k).join('') + '-');
          parts = parts.slice(k);
        }
        cur = parts.join('');
      });
      if (cur) lines.push(cur);
      return lines;
    }
    function formatDecimal(val, sufix = '') {
      const r = Math.round(val * 10) / 10;
      if (r % 1 === 0) return r + sufix;
      return r.toFixed(1).replace('.', ',') + sufix;

    function formatMilions(v, curt) {

    }
    // Text multilínia; y = línia base de la primera línia
    function linies(g, lines, x, y, lh, o) {
      const t = g.append('text').attr('x', x).attr('y', y)
        .attr('font-family', o.fam || FR).attr('font-size', o.size)
        .attr('font-weight', o.weight || 400).attr('fill', o.fill || C.text)
        .attr('text-anchor', o.anchor || 'start');
      lines.forEach((l, i) => t.append('tspan').attr('x', x).attr('dy', i ? lh : 0).text(l));
      return t;
    }
    // Text amb segments de pes diferent, ajustat a una amplada
    function textRic(g, segs, x, y, maxW, size, lh, fam, fill) {
      const words = [];
      segs.forEach(s => s.t.split(' ').filter(Boolean).forEach(w => words.push({ t: w, w: s.w })));
      const sp = mesura(' ', size, 400, fam);
      const lines = [[]]; let lw = 0;
      words.forEach(wd => {
        const ww = mesura(wd.t, size, wd.w, fam);
        const cur = lines[lines.length - 1];
        const add = (cur.length ? sp : 0) + ww;
        if (cur.length && lw + add > maxW) { lines.push([wd]); lw = ww; } else { cur.push(wd); lw += add; }
      });
      if (g) lines.forEach((ln, i) => {
        const t = g.append('text').attr('x', x).attr('y', y + i * lh)
          .attr('font-family', fam).attr('font-size', size).attr('fill', fill);
        ln.forEach((wd, j) => t.append('tspan').attr('font-weight', wd.w).text((j ? ' ' : '') + wd.t));
      });

    }
    // Titolet de bloc (Merriweather 15px negreta). Retorna alçada i amplada de la 1a línia
    function titolet(g, text, x, y, maxW) {

      if (g) linies(g, lines, x, y + 15, 22, { fam: FM, size: 15, weight: 700 });
      return { h: lines.length * 22, w1: mesura(lines[0], 15, 700, FM) };

    // Escala dicotòmica: vermell (0) → blanc (5) → verd (10)
    const escVerd = d3.piecewise(d3.interpolateRgb, ['#94E6CD', '#5EE9BE', '#0DD497', '#0AA475', '#0A7B59', '#09533D']);
    const escVerm = d3.piecewise(d3.interpolateRgb, ['#FBA298', '#FF7161', '#FF432E', '#FA1900', '#C71400', '#9E1000']);
    function colorNota(v) {
      if (v === 5) return '#FFFFFF';
      if (v < 5) return escVerm(0.2 + (1 - v / 5) * 0.7);

      if (x < M) x = M;
      if (y + th + M > H) y = ev.clientY - th - 14;

    // ───────────── BLOC 1 (desktop): columnes circulars ─────────────
    function layoutPolar(w, h) {
      const lh = fsR + 3;
      const inTxt = trenca('Total anual de turistes a les platges de la ciutat:', 104, fsN, 400, FM);
      const inLH = 17, bigSize = 18, bigLH = 24;
      const blockH = inTxt.length * inLH + bigLH;
      let r0 = 0;
      inTxt.forEach((l, i) => {
        const top = -blockH / 2 + i * inLH + 3, bot = top + inLH - 4;
        r0 = Math.max(r0, Math.hypot(mesura(l, fsN, 400, FM) / 2, Math.max(Math.abs(top), Math.abs(bot))));
      });
      r0 = Math.max(r0, Math.hypot(mesura('10 milions', bigSize, 700, FM) / 2, blockH / 2 - 3));
      r0 += 8;

      const n = ACTIVITATS.length, step = 2 * Math.PI / n, vmax = d3.max(ACTIVITATS, d => d.v);
      const items = ACTIVITATS.map((d, i) => {
        const th = -i * step;
        const nameLines = trenca(d.nom, 86, fsR, 400, FR);
        const num = formatMilions(d.v, false);
        const wl = Math.max(...nameLines.map(l => mesura(l, fsR, 400, FR)), mesura(num, fsR, 700, FR));
        return { d, th, s: Math.sin(th), c: Math.cos(th), nameLines, num, wl, hl: (nameLines.length + 1) * lh, frac: d.v / vmax };
      });
      function ext(L) {
        const e = { minX: -r0, maxX: r0, minY: -r0, maxY: r0 };
        const upd = (x, y) => { e.minX = Math.min(e.minX, x); e.maxX = Math.max(e.maxX, x); e.minY = Math.min(e.minY, y); e.maxY = Math.max(e.maxY, y); };
        items.forEach(it => {
          const R = r0 + L * it.frac;
          for (let q = -2; q <= 2; q++) { const a = it.th + q * step / 4; upd(R * Math.sin(a), -R * Math.cos(a)); }
          const rl = R + 6, px = rl * it.s, py = -rl * it.c;
          const left = it.s > 0.25 ? px : it.s < -0.25 ? px - it.wl : px - it.wl / 2;
          const top = py - it.hl * (1 + it.c) / 2;
          it.box = { left, top };
          upd(left, top); upd(left + it.wl, top + it.hl);
        });
        return e;
      }
      const fits = L => { const e = ext(L); return e.maxX - e.minX <= w && e.maxY - e.minY <= h; };
      let lo = 0, hi = 2000;
      if (fits(0)) { for (let k = 0; k < 30; k++) { const m = (lo + hi) / 2; if (fits(m)) lo = m; else hi = m; } }
      const L = lo;
      const e = ext(L);
      return { L, r0, items, e, step, lh, inTxt, inLH, bigSize, bigLH, blockH };
    }

    function dibuixaPolar(g, P, x0, y0, w, h) {
      const { L, r0, items, e, step, lh } = P;
      const cx = x0 - e.minX + (w - (e.maxX - e.minX)) / 2;
      const cy = y0 - e.minY + (h - (e.maxY - e.minY)) / 2;
      const arc = d3.arc().padRadius(r0).padAngle(4 / r0);
      const gp = g.append('g').attr('transform', `translate(${cx},${cy})`);
      items.forEach(it => {

          .attr('d', arc({ innerRadius: r0, outerRadius: r0 + L * it.frac, startAngle: it.th - step / 2, endAngle: it.th + step / 2 }));
      });
      let esport = null;
      items.forEach((it, i) => {
        const anchor = it.s > 0.25 ? 'start' : it.s < -0.25 ? 'end' : 'middle';
        const ax = it.box.left + (anchor === 'start' ? 0 : anchor === 'end' ? it.wl : it.wl / 2);
        const t = gp.append('text').attr('x', ax).attr('y', it.box.top + lh - 3)
          .attr('font-family', FR).attr('font-size', fsR).attr('text-anchor', anchor);
        it.nameLines.forEach((l, j) => t.append('tspan').attr('x', ax).attr('dy', j ? lh : 0).attr('fill', C.text2).text(l));
        t.append('tspan').attr('x', ax).attr('dy', lh).attr('font-weight', 700).attr('fill', C.text).text(it.num);
        if (i === items.length - 1) {
          const nb = it.box.top + lh - 3 + it.nameLines.length * lh;
          const nw = mesura(it.num, fsR, 700, FR);
          const right = anchor === 'start' ? ax + nw : anchor === 'end' ? ax : ax + nw / 2;
          esport = { x: cx + right + 5, y: cy + nb - fsR * 0.35 };
        }
      });
      // Text del cercle central
      const top = -P.blockH / 2;
      linies(gp, P.inTxt, 0, top + P.inLH - 4, P.inLH, { fam: FM, size: fsN, fill: C.text2, anchor: 'middle' });
      gp.append('text').attr('x', 0).attr('y', P.blockH / 2 - 5).attr('text-anchor', 'middle')
        .attr('font-family', FM).attr('font-size', P.bigSize).attr('font-weight', 700).attr('fill', C.text).text('10 milions');
      return esport;
    }

    // ───────────── BLOC 1 (mòbil): columnes rectes ─────────────
    function dibuixaBarres(g, w, h) {

    // ───────────── BLOC 2: perfils amb columnes de cercles ─────────────
    function dibuixaPerfils(g, x0, y0, w, h, mobil, titolMaxW, pMin = 4) {
      const tt = titolet(g, 'Perfil dels esportistes a la sorra', x0, y0, titolMaxW);
      const rows = mobil ? [[0, 1], [2, 3], [4, 'L']] : [[0, 1, 2], [3, 4, 'L']];
      const G = mobil ? 14 : 22;
      const miniFS = 12.5, miniLH = 17;
      const listItems = [['Principals estats:', 700], ...ESTATS.map(e => [`${e[0]}: ${e[1]}%`, 400])];
      const listLH = fsR + 5;
      const listW = d3.max(listItems, l => mesura(l[0], fsR, l[1], FR));
      const connGap = mobil ? 14 : 24;
      const listArea = listW + connGap;

      const info = rows.map(r => {
        const charts = r.filter(k => k !== 'L'), hasL = r.includes('L');
        const avail = w - (charts.length - 1) * G - (hasL ? listArea : 0);
        // Amplada per columna: repartiment uniforme, però mai per sota de la paraula més llarga de l'etiqueta
        // Si les paraules senceres no hi caben, s'admet partir-les per síl·labes
        const cols = [];

          const valW = mesura(c[1] + '%', fsR, 400, FR);
          const toks = trossos(c[0]);
          const paraula = d3.max(toks, tk => mesura(netejaShy(tk.t), fsR, 400, FR));
          const sillaba = d3.max(toks, tk => d3.max(tk.t.split(SHY), (s, q, arr) => mesura(s + (q < arr.length - 1 ? '-' : ''), fsR, 400, FR)));

        }));
        if (d3.sum(cols, c => c.min) > avail) cols.forEach(c => { c.min = c.minSil; });
        const sumMin = d3.sum(cols, c => c.min);
        if (sumMin > avail) cols.forEach(c => { c.min *= avail / sumMin; });
        const fixed = cols.map(() => false);
        let cw = 0;
        for (let it = 0; it < cols.length; it++) {
          let rest = avail, n = 0;
          cols.forEach((c, q) => { if (fixed[q]) rest -= c.min; else n++; });
          cw = n ? rest / n : 0;
          let canvi = false;
          cols.forEach((c, q) => { if (!fixed[q] && c.min > cw) { fixed[q] = true; canvi = true; } });
          if (!canvi) break;
        }
        const colW = charts.map(() => []);
        cols.forEach((c, q) => { colW[c.i][c.j] = fixed[q] ? c.min : cw; });
        const chartW = colW.map(ws => d3.sum(ws));
        const titLines = charts.map((k, i) => trenca(PERFILS[k].titol, chartW[i], miniFS, 700, FM));
        const labLines = charts.map((k, i) => PERFILS[k].cats.map((c, j) => trenca(c[0], colW[i][j] - 4, fsR, 400, FR)));
        const titH = d3.max(titLines, l => l.length) * miniLH + 2;
        const labH = d3.max(labLines, ls => d3.max(ls, l => l.length)) * (fsR + 2) + 6;
        const valH = fsR + 6;
        const maxV = d3.max(charts, k => d3.max(PERFILS[k].cats, c => c[1]));
        return { charts, hasL, colW, chartW, titLines, labLines, titH, labH, valH, maxV, over: titH + valH + labH };
      });

      const rowGap = mobil ? 8 : 12;
      const top0 = y0 + tt.h + (mobil ? 6 : 8);
      // Mode mesura (g = null): alçada mínima amb 3 cercles per nivell i pas pMin
      if (!g) return { minH: (top0 - y0) + d3.sum(info, ri => ri.over + ri.maxV / 15 * pMin) + (rows.length - 1) * rowGap };
      const availH = y0 + h - top0 - (rows.length - 1) * rowGap;
      const minCW = d3.min(info, ri => d3.min(ri.colW, ws => d3.min(ws)));
      // Cercles per nivell (2 o 3, igual per a tots els mini-gràfics): el que permet cercles més grans.
      // Cada cercle = 5% → un nivell = 5·n %
      let n = 2, p = 0;
      [2, 3].forEach(nn => {
        const units = d3.sum(info, ri => ri.maxV / (5 * nn));
        const pn = Math.max(2, Math.min((availH - d3.sum(info, ri => ri.over)) / units, (minCW - 4) / nn, 22));
        if (pn > p + 0.01) { p = pn; n = nn; }
      });
      info.forEach(ri => { ri.maxU = ri.maxV / (5 * n); });
      const extra = Math.max(0, (availH - d3.sum(info, ri => ri.over + ri.maxU * p)) / rows.length);
      const d = p * 0.86;
      let yRow = top0, clipN = 0;

      info.forEach(ri => {
        const base = yRow + extra / 2 + ri.titH + ri.valH + ri.maxU * p;
        let xc = x0, titolCont = null;
        ri.charts.forEach((k, i) => {
          const P = PERFILS[k], ws = ri.colW[i], cwTot = ri.chartW[i];
          linies(g, ri.titLines[i], xc, yRow + extra / 2 + 13, miniLH, { fam: FM, size: miniFS, weight: 700 });
          if (k === 4) titolCont = { x: xc + mesura(ri.titLines[i][0], miniFS, 700, FM) + 6, y: yRow + extra / 2 + 13 - 4.5 };
          g.append('line').attr('x1', xc + 2).attr('x2', xc + cwTot - 2)
            .attr('y1', base + 0.5).attr('y2', base + 0.5).attr('stroke', C.base).attr('stroke-width', 1);
          P.cats.forEach((c, j) => {
            const cx = xc + d3.sum(ws.slice(0, j)) + ws[j] / 2, u = c[1] / 5, full = Math.floor(u + 1e-9), frac = u - full;
            // Cercle q: nivell floor(q/n), posició q % n d'esquerra a dreta
            const pos = q => ({ x: cx + (q % n - (n - 1) / 2) * p, y: base - p * (Math.floor(q / n) + 0.5) });
            let topY = base;
            for (let q = 0; q < full; q++) {
              const o = pos(q);
              g.append('circle').attr('cx', o.x).attr('cy', o.y).attr('r', d / 2).attr('fill', P.colors[j]);
              topY = Math.min(topY, o.y - d / 2);
            }
            if (frac > 0.01) {
              const id = 'clip-c' + (clipN++);
              const o = pos(full), bot = o.y + d / 2;
              defs.append('clipPath').attr('id', id).append('rect')
                .attr('x', o.x - d / 2 - 1).attr('y', bot - frac * d).attr('width', d + 2).attr('height', frac * d + 1);
              g.append('circle').attr('cx', o.x).attr('cy', o.y).attr('r', d / 2).attr('fill', P.colors[j]).attr('clip-path', `url(#${id})`);
              topY = Math.min(topY, bot - frac * d);
            }
            g.append('text').attr('x', cx).attr('y', topY - 4).attr('text-anchor', 'middle')
              .attr('font-family', FR).attr('font-size', fsR).attr('fill', C.text).text(c[1] + '%');
            linies(g, ri.labLines[i][j], cx, base + fsR + 4, fsR + 2, { size: fsR, fill: C.text2, anchor: 'middle' });
          });
          xc += cwTot + G;
        });
        if (ri.hasL && titolCont) {
          // Fletxa des del titolet «Continents d'origen» fins a la llista d'estats
          const xl = xc - G + connGap;
          const rowBottom = base + ri.labH;
          const llargLlista = fsR * 0.35 + (listItems.length - 1) * listLH + 4;
          const ly = Math.min(titolCont.y, rowBottom - llargLlista);
          const dPath = ly === titolCont.y
            ? `M${titolCont.x},${ly}H${xl - 4}`
            : `M${titolCont.x},${titolCont.y}H${xl - 12}V${ly}H${xl - 4}`;
          g.append('path').attr('d', dPath).attr('fill', 'none').attr('stroke', C.linia)
            .attr('stroke-width', 1).attr('marker-end', 'url(#fletxa)');
          listItems.forEach((l, i) => {
            g.append('text').attr('x', xl).attr('y', ly + fsR * 0.35 + i * listLH)
              .attr('font-family', FR).attr('font-size', fsR).attr('font-weight', l[1]).attr('fill', C.text).text(l[0]);
          });
        }
        yRow += ri.over + ri.maxU * p + extra + rowGap;
      });
      return { titolW: tt.w1 };
    }

    // ───────────── BLOC 3: mapa de platges ─────────────
    function dibuixaMapa(g, x0, y0, w, h, TW) {
      const tt = titolet(g, "Les millors platges per a l'activitat esportiva", x0, y0, w);
      const mx = x0, my = y0 + tt.h + 6, mw = w;
      let mh = h - tt.h - 6;
      if (mh < 40 || mw < 60) return;
      const [bx0, by0, bx1, by1] = GEO.bbox, bw = bx1 - bx0, bh = by1 - by0;
      const B = GEO.beaches, sq = b => Math.sqrt(b.nota / 10);
      // Botons de zoom: sempre dins del mapa; si el mapa és baix, més petits (i en fila si cal)
      function midaBotons(hM, wM) {
        const M = hM < 100 ? 4 : 8, G = hM < 100 ? 2 : 4;
        let s = Math.floor((hM - 2 * M - 2 * G) / 3), fila = false;
        if (s < 16) { fila = true; s = Math.min(hM - 2 * M, (wM - 2 * M - 2 * G) / 3); }
        else s = Math.min(s, wM - 2 * M);
        s = Math.max(10, Math.min(26, Math.floor(s)));
        return { s, M, G, fila, ample: fila ? 3 * s + 2 * G : s };
      }
      let BZ = midaBotons(mh, mw);
      const CTRL_W = BZ.ample + BZ.M + 4;   // franja reservada a la dreta per als botons
      let rMax = Math.max(6, Math.min(22, mh * 0.2)), k = 1;
      for (let it = 0; it < 3; it++) {
        k = Math.max(0.001, Math.min((mw - 2 * (rMax + 8) - CTRL_W) / bw, (mh - 2 * (rMax + fsR + 6)) / bh));
        for (let i = 0; i < B.length - 1; i++) {
          const dist = Math.hypot(B[i + 1].cx - B[i].cx, B[i + 1].cy - B[i].cy) * k;
          rMax = Math.min(rMax, (dist - 3) / (sq(B[i]) + sq(B[i + 1])));
        }
        rMax = Math.max(5, rMax);
      }
      // No mostrar més terra endins que la que cobreixen les capes de carrers
      mh = Math.min(mh, 4200 * k);
      BZ = midaBotons(mh, mw);
      const tx = mx + (mw - CTRL_W) / 2 - k * (bx0 + bx1) / 2;
      const ty = my + mh / 2 - k * (by0 + by1) / 2;

      defs.append('clipPath').attr('id', 'clip-mapa').append('rect')
        .attr('x', mx).attr('y', my).attr('width', mw).attr('height', mh).attr('rx', 3);
      const gm = g.append('g').attr('clip-path', 'url(#clip-mapa)');
      gm.append('rect').attr('x', mx).attr('y', my).attr('width', mw).attr('height', mh).attr('fill', C.mar);
      const gg = gm.append('g');
      gg.append('path').attr('d', GEO.land).attr('fill', C.terra);
      gg.append('path').attr('d', GEO.parcs).attr('fill', C.parc);
      const carrer = d => gg.append('path').attr('d', d).attr('fill', 'none').attr('stroke', '#FFFFFF')
        .attr('stroke-linecap', 'round').attr('stroke-linejoin', 'round').attr('vector-effect', 'non-scaling-stroke');
      const sMenors = carrer(GEO.carrersMenors);
      const sPrinc = carrer(GEO.carrersPrincipals);
      B.forEach(b => gg.append('path').attr('d', b.d).attr('fill', C.sorra));

      // Cercles i notes: mida fixa en píxels, reposicionats en fer zoom
      const gc = gm.append('g');
      const marques = B.map(b => {
        const r = rMax * sq(b);
        const col = colorNota(b.nota), txt = formatDecimal(b.nota);
        const html = `<strong>${b.nom}</strong><br>Valoració per a l'esport: ${txt} sobre 10.`;
        const circ = gc.append('circle').attr('r', r)
          .attr('fill', col).attr('stroke', '#000').attr('stroke-opacity', 0.55).attr('stroke-width', 1)
          .style('cursor', 'pointer')
          .on('mouseover', ev => { circ.attr('stroke-width', 2).attr('stroke-opacity', 1); showTooltip(html); moveTooltip(ev); })
          .on('mousemove', moveTooltip)
          .on('mouseout', () => { circ.attr('stroke-width', 1).attr('stroke-opacity', 0.55); hideTooltip(); })
          .on('click', ev => { showTooltip(html); moveTooltip(ev); ev.stopPropagation(); });
        const inside = 2 * r >= mesura(txt, fsR, 700, FR) + 6 && r >= fsR * 0.8;
        const fosc = d3.hsl(col).l < 0.45;
        const lab = gc.append('text').attr('text-anchor', 'middle').attr('font-family', FR)
          .attr('font-size', fsR).attr('font-weight', 700)
          .attr('fill', inside && fosc ? '#FFFFFF' : C.text).style('pointer-events', 'none').text(txt);
        return { b, r, inside, circ, lab };
      });

      function aplica(t) {
        gg.attr('transform', `translate(${t.x},${t.y}) scale(${t.k}) translate(${tx},${ty}) scale(${k})`);
        sMenors.attr('stroke-width', 0.6 * Math.pow(t.k, 0.6));
        sPrinc.attr('stroke-width', 1.5 * Math.pow(t.k, 0.6));
        marques.forEach(m => {
          const px = t.applyX(tx + k * m.b.cx), py = t.applyY(ty + k * m.b.cy);
          m.circ.attr('cx', px).attr('cy', py);
          m.lab.attr('x', px).attr('y', m.inside ? py + fsR * 0.35 : py + m.r + fsR + 1);
        });
      }

      // Zoom: només apropar (mínim = vista inicial) i desplaçament limitat a la vista inicial.
      // La roda del ratolí només fa zoom amb Ctrl/⌘ per no bloquejar el desplaçament de la pàgina.
      const zoom = d3.zoom()
        .scaleExtent([1, 12])
        .extent([[mx, my], [mx + mw, my + mh]])
        .translateExtent([[mx, my], [mx + mw, my + mh]])
        .filter(ev => ev.type === 'wheel' ? (ev.ctrlKey || ev.metaKey) : !ev.button)
        .on('zoom', ev => { aplica(ev.transform); hideTooltip(); });
      gm.call(zoom);
      aplica(d3.zoomIdentity);

      const zc = document.getElementById('zoom-controls');
      zc.style.display = 'flex';
      zc.style.flexDirection = BZ.fila ? 'row' : 'column';
      zc.style.gap = BZ.G + 'px';
      zc.style.top = (my + BZ.M) + 'px';
      zc.style.right = (TW - (mx + mw) + BZ.M) + 'px';
      zc.querySelectorAll('.ctrl-btn').forEach(b => {
        b.style.width = BZ.s + 'px';
        b.style.height = BZ.s + 'px';
        b.style.fontSize = Math.max(9, Math.round(BZ.s * 0.54)) + 'px';
      });
      d3.select('#zoom-in').on('click', ev => { ev.stopPropagation(); gm.transition().duration(300).call(zoom.scaleBy, 1.8); });
      d3.select('#zoom-out').on('click', ev => { ev.stopPropagation(); gm.transition().duration(300).call(zoom.scaleBy, 1 / 1.8); });
      d3.select('#zoom-reset').on('click', ev => { ev.stopPropagation(); gm.transition().duration(300).call(zoom.transform, d3.zoomIdentity); });
    }

    // ───────────── DIBUIX GENERAL ─────────────
    const svg = d3.select('#mapa');
    function fletxa(parent, dPath) {
      parent.append('path').attr('d', dPath).attr('fill', 'none').attr('stroke', C.linia)
        .attr('stroke-width', 1).attr('marker-end', 'url(#fletxa)');
    }

    function draw() {
      svg.selectAll('*').remove();
      const wrapper = document.getElementById('mapa-wrapper');
      const TW = wrapper.clientWidth, TH = wrapper.clientHeight;
      if (TW < 1 || TH < 1) return;
      svg.attr('width', TW).attr('height', TH);
      const mobil = window.innerWidth < 900;
      document.getElementById('zoom-controls').style.display = 'none';

      defs = svg.append('defs');
      defs.append('marker').attr('id', 'fletxa').attr('viewBox', '0 0 8 8')
        .attr('refX', 7.5).attr('refY', 4).attr('markerWidth', 7).attr('markerHeight', 7).attr('orient', 'auto')
        .append('path').attr('d', 'M0,0.5L8,4L0,7.5Z').attr('fill', C.linia);

      if (!mobil) {
        const GAP = 30;
        let b1W, P, t1H, notaL, hC;
        for (const f of [1 / 3, 0.36, 0.38, 0.40]) {
          b1W = TW * f;
          t1H = trenca('Quants hi fan cada activitat?', b1W, 15, 700, FM).length * 22;
          notaL = trenca(NOTA_B1, b1W, fsN, 400, FM);
          hC = TH - t1H - notaL.length * 17 - 14;
          P = layoutPolar(b1W, hC);
          if (P.L >= Math.min(110, P.r0 * 1.5)) break;
        }
        const g1 = svg.append('g');
        titolet(g1, 'Quants hi fan cada activitat?', 0, 0, b1W);
        // Nota sota el titolet
        linies(g1, notaL, 0, t1H + 13, 17, { fam: FM, size: fsN, fill: C.text2 });
        const esport = dibuixaPolar(g1, P, 0, t1H + notaL.length * 17 + 14, b1W, hC);

        const b2X = b1W + GAP, b2W = TW - b2X, b2H = Math.round(TH * 2 / 3);
        dibuixaPerfils(svg.append('g'), b2X, 0, b2W, b2H - 8, false, b2W);
        dibuixaMapa(svg.append('g'), b2X, b2H + 10, b2W, TH - b2H - 10, TW);

        if (esport) {
          const xv = b1W + GAP / 2;
          fletxa(svg, `M${esport.x},${esport.y}H${xv}V10H${b2X - 3}`);
        }
      } else {
        // Repartiment 40/60. Si el bloc 2 no hi cap, el bloc 1 cedeix alçada;
        // si tampoc així hi caben tots dos, s'escala el conjunt (últim recurs).
        const GAPV = 16, P_MIN = 4;
        let escala = 1, W = TW, H = TH, m1, m2;
        for (let it = 0; it < 4; it++) {
          W = TW / escala; H = TH / escala;
          m1 = dibuixaBarres(null, W, 0);
          m2 = dibuixaPerfils(null, 0, 0, W, 0, true, m1.vx - 18, P_MIN);
          const cal = m1.minH + GAPV + m2.minH;
          if (cal <= H + 0.5) break;
          escala = TH / cal;
        }
        let b1H = Math.round(H * 0.4);
        if (H - b1H - GAPV < m2.minH) b1H = Math.max(m1.minH, H - GAPV - m2.minH);
        const root = svg.append('g');
        if (escala < 1) root.attr('transform', `scale(${escala})`);
        const bi = dibuixaBarres(root.append('g'), W, b1H);
        const y2 = b1H + GAPV;
        const pi = dibuixaPerfils(root.append('g'), 0, y2, W, H - y2, true, bi.vx - 18, P_MIN);
        fletxa(root, `M${bi.vx},${bi.labBottom}V${y2 + 10}H${pi.titolW + 4}`);
      }
    }

    let rafId;
    if (window.ResizeObserver) {
      new ResizeObserver(() => {
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(draw);
      }).observe(document.getElementById('mapa-wrapper'));
    } else {
      window.addEventListener('resize', () => {
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(draw);
      });
      draw();
    }
    // Redibuixar quan les fonts estiguin carregades (les mesures de text depenen de la font)
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
  </script>
</body>
</html>
